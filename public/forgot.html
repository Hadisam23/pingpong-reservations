<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Forgot password · Rally Club</title>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="ui-app ui-page--white">
  <main class="ui-screen" aria-labelledby="title">
    <div class="ui-screen__top">
      <a class="ui-icon-btn" href="login.html" aria-label="Back"><span data-ui-icon="back"></span></a>
    </div>

    <div id="ask">
      <h1 class="ui-h1 ui-screen__title" id="title">Forgot your password?</h1>
      <p class="ui-screen__lede">Enter your email and we'll send you a link to set a new one.</p>
      <form class="ui-form" id="form" novalidate>
        <div class="ui-form__alert" role="alert" tabindex="-1" hidden></div>
        <div class="ui-field">
          <label class="ui-field__label" for="email">Email</label>
          <input class="ui-input" id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
        </div>
      </form>
    </div>

    <div id="sent" hidden>
      <h1 class="ui-h1 ui-screen__title" tabindex="-1" id="sentTitle">Check your email</h1>
      <p class="ui-screen__lede" id="sentText"></p>
      <div class="ui-callout"><span data-ui-icon="clock"></span>The link works once and expires in 1 hour.</div>
    </div>

    <div class="ui-screen__spacer"></div>

    <button class="ui-btn ui-btn--primary ui-btn--lg ui-btn--block" type="submit" form="form" id="submit">Send reset link</button>
    <a class="ui-btn ui-btn--secondary ui-btn--lg ui-btn--block" href="login.html" id="back" hidden>Back to log in</a>
  </main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('form');
    const email = document.getElementById('email');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      UI.clearErrors(form);
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim())) { UI.fieldError(email, 'Enter a valid email address'); email.focus(); return; }
      const btn = document.getElementById('submit');
      UI.setLoading(btn, true);
      try {
        await Auth.forgot(email.value.trim());
        // Same message either way: it never reveals whether an account exists
        document.getElementById('sentText').textContent = `If there's an account for ${email.value.trim()}, we've sent a link to set a new password.`;
        document.getElementById('ask').hidden = true;
        document.getElementById('sent').hidden = false;
        btn.hidden = true;
        document.getElementById('back').hidden = false;
        document.getElementById('sentTitle').focus();
      } catch (err) {
        UI.setLoading(btn, false);
        UI.showError(form, err);
      }
    });
  </script>
</body>
</html>
