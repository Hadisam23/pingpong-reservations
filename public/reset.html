<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>New password · Rally Club</title>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="ui-app ui-page--white">
  <main class="ui-screen" aria-labelledby="title">
    <div class="ui-screen__top">
      <a class="ui-icon-btn" href="login.html" aria-label="Back"><span data-ui-icon="back"></span></a>
    </div>

    <h1 class="ui-h1 ui-screen__title" id="title">Set a new password</h1>
    <p class="ui-screen__lede">Use 8 or more characters. You'll be logged out on your other devices.</p>

    <form class="ui-form" id="form" novalidate>
      <div class="ui-form__alert" role="alert" tabindex="-1" hidden></div>
      <div class="ui-field">
        <label class="ui-field__label" for="password">New password</label>
        <input class="ui-input" id="password" name="password" type="password" autocomplete="new-password" placeholder="8+ characters">
      </div>
      <div class="ui-field">
        <label class="ui-field__label" for="confirm">Repeat new password</label>
        <input class="ui-input" id="confirm" name="confirm" type="password" autocomplete="new-password">
      </div>
    </form>

    <div class="ui-screen__spacer"></div>

    <button class="ui-btn ui-btn--primary ui-btn--lg ui-btn--block" type="submit" form="form" id="submit">Save and log in</button>
    <a class="ui-btn ui-btn--secondary ui-btn--lg ui-btn--block" href="forgot.html" id="again" hidden>Request a new link</a>
  </main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('form');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm');
    const btn = document.getElementById('submit');

    function linkBroken(message) {
      const alert = form.querySelector('.ui-form__alert');
      alert.textContent = message;
      alert.hidden = false;
      btn.hidden = true;
      document.getElementById('again').hidden = false;
    }
    if (!token) linkBroken('This page needs the link from your email. Request a new one.');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      UI.clearErrors(form);
      if (password.value.length < 8) { UI.fieldError(password, 'Use 8 or more characters'); password.focus(); return; }
      if (confirm.value !== password.value) { UI.fieldError(confirm, "The passwords don't match"); confirm.focus(); return; }
      UI.setLoading(btn, true);
      try {
        await Auth.reset({ token, password: password.value });
        sessionStorage.setItem('rc.flash', 'Password updated. You are logged in.');
        location.replace('home.html');
      } catch (err) {
        UI.setLoading(btn, false);
        if (err.code === 'invalid_reset_link') linkBroken(err.message);
        else UI.showError(form, err);
      }
    });
  </script>
</body>
</html>
