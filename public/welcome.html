<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0B1F3A">
  <title>Welcome · Rally Club</title>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="ui-app ui-page--navy">
  <main class="ui-screen ui-welcome">
    <div class="ui-welcome__line" aria-hidden="true"></div>
    <div class="ui-welcome__net" aria-hidden="true"></div>
    <div class="ui-welcome__ring" aria-hidden="true"></div>
    <div class="ui-welcome__ball" aria-hidden="true"></div>

    <div id="logo"></div>

    <div class="ui-screen__spacer"></div>

    <div class="ui-welcome__copy">
      <span class="ui-eyebrow ui-eyebrow--lg">Table tennis club</span>
      <h1 class="ui-display">Book a table.<br>Book a coach.<br>Play more.</h1>
      <p>Reserve tables in seconds, take lessons with club coaches, and manage your membership in one place.</p>
    </div>

    <div class="ui-welcome__actions">
      <a class="ui-btn ui-btn--inverse ui-btn--lg ui-btn--block" href="signup.html">Create account</a>
      <a class="ui-btn ui-btn--outline-on-navy ui-btn--lg ui-btn--block" href="login.html">I already have an account</a>
      <a class="ui-welcome__guest" href="index.html">Book as a guest</a>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script>
    document.getElementById('logo').innerHTML = UI.logo({ onNavy: true });
    // Already signed in: go straight to the profile
    Auth.me().then(user => { if (user) location.replace('profile.html'); }).catch(() => {});
  </script>
</body>
</html>
