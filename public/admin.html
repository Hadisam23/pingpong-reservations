<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Front desk · Rally Club</title>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="ui-app ad">
  <!-- Sign in (staff accounts) -->
  <main class="ad-login" id="login" hidden>
    <form class="ad-card ui-form" id="loginForm" novalidate>
      <div id="loginLogo"></div>
      <div>
        <h1 class="ui-h2">Front desk</h1>
        <p class="ad-muted">Log in with your staff account.</p>
      </div>
      <div class="ui-form__alert" role="alert" tabindex="-1" hidden></div>
      <div class="ui-field"><label class="ui-field__label" for="lEmail">Email</label><input class="ui-input" id="lEmail" name="email" type="email" autocomplete="username" required></div>
      <div class="ui-field"><label class="ui-field__label" for="lPassword">Password</label><input class="ui-input" id="lPassword" name="password" type="password" autocomplete="current-password" required></div>
      <button type="submit" class="ui-btn ui-btn--primary ui-btn--lg ui-btn--block" id="loginBtn">Log in</button>
    </form>
  </main>

  <div class="ad-shell" id="shell" hidden>
    <aside class="ad-side">
      <div id="sideLogo"></div>
      <nav class="ad-nav" id="nav" aria-label="Admin"></nav>
      <div class="ad-side__foot">
        <span id="whoami"></span>
        <button type="button" class="ui-btn ui-btn--secondary ui-btn--sm" id="logout"><span data-ui-icon="logout"></span>Log out</button>
      </div>
    </aside>
    <main class="ad-main" id="main" aria-live="polite"></main>
  </div>

  <div class="ad-drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="ad-drawer__panel" id="drawerPanel"></div>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>
