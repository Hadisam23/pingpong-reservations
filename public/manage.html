<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Find my booking · Rally Club</title>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
</head>
<body class="ui-app">
  <div class="ui-shell">
    <main class="ui-screen ui-screen--app" aria-labelledby="title">
      <div class="ui-screen__head">
        <a class="ui-icon-btn" href="bookings.html" aria-label="Back"><span data-ui-icon="back"></span></a>
        <h1 class="ui-h2" id="title">Find my booking</h1>
      </div>
      <p class="ui-body ui-muted">Booked as a guest on another phone or computer? Enter the booking code from your email and the phone number or email you booked with.</p>

      <form class="ui-card ui-form" id="form" novalidate>
        <div class="ui-form__alert" role="alert" tabindex="-1" hidden></div>
        <div class="ui-field">
          <label class="ui-field__label" for="code">Booking code</label>
          <input class="ui-input" id="code" name="code" placeholder="RC-7KQ2PX" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12">
        </div>
        <div class="ui-field">
          <label class="ui-field__label" for="contact">Phone or email</label>
          <input class="ui-input" id="contact" name="contact" autocomplete="email" inputmode="email">
        </div>
        <button type="submit" class="ui-btn ui-btn--primary ui-btn--lg ui-btn--block" id="submit">Find booking</button>
      </form>
      <p class="ui-small ui-muted">Have an account? <a class="ui-link" href="login.html?next=bookings.html">Log in</a> to see all your bookings.</p>
    </main>
    <nav id="tabbar"></nav>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    const open = (code, token) => {
      App.rememberGuestBooking(code, token);
      location.replace(`confirmed.html?${new URLSearchParams({ code, token, view: 'pass' })}`);
    };
    // Links from booking emails carry the code and token already
    if (App.param('code') && App.param('t')) open(App.param('code'), App.param('t'));

    $('#form').addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;
      UI.clearErrors(form);
      const missing = [['code', 'Enter the booking code'], ['contact', 'Enter your phone number or email']].filter(([id]) => !$(`#${id}`).value.trim());
      if (missing.length) { missing.forEach(([id, msg]) => UI.fieldError($(`#${id}`), msg)); $(`#${missing[0][0]}`).focus(); return; }
      UI.setLoading($('#submit'), true);
      try {
        const found = await api('/api/reservations/find', { method: 'POST', body: { code: $('#code').value, contact: $('#contact').value } });
        open(found.code, found.token);
      } catch (err) {
        UI.showError(form, err);
        UI.setLoading($('#submit'), false);
      }
    });
    if (App.param('code')) $('#code').value = App.param('code');
    Auth.me().catch(() => null).then(user => App.tabbar('bookings', { guest: !user }));
  </script>
</body>
</html>
