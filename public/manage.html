<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Booking</title>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="index.html"><span data-icon="brand"></span><span class="brand__name" id="centerName">Ping Pong Center</span></a>
      <div class="app-header__end">
        <a class="btn btn--primary btn--sm" href="index.html">Book a table</a>
      </div>
    </div>
  </header>

  <main class="page page--narrow">
    <section class="hidden" id="lookup" aria-labelledby="lookupTitle">
      <div class="page-head">
        <div class="page-head__text">
          <h1 id="lookupTitle">Find your booking</h1>
          <p class="lede">Enter the code from your confirmation and the phone number you booked with.</p>
        </div>
      </div>
      <div class="card">
        <div id="lookupError" class="alert err hidden" role="alert"></div>
        <form id="lookupForm" novalidate>
          <div class="field">
            <label for="code">Booking code</label>
            <input id="code" class="code-input" autocomplete="off" autocapitalize="characters" maxlength="6" placeholder="K7QX2M">
          </div>
          <div class="field">
            <label for="phone">Phone number</label>
            <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="050-123-4567">
          </div>
          <button class="btn btn--primary btn--lg btn--block" type="submit" id="lookupBtn">Find booking</button>
        </form>
      </div>
    </section>

    <section class="hidden" id="view" aria-labelledby="viewTitle">
      <h1 class="sr-only" id="viewTitle">Your booking</h1>
      <div id="viewMsg" class="alert hidden" role="status"></div>
      <div class="ticket">
        <div class="ticket__top">
          <div class="ticket__row"><span>Booking code</span><span class="badge" id="vStatus"></span></div>
          <div class="ticket__code" id="vCode"></div>
          <div class="ticket__time" id="vTime"></div>
        </div>
        <div class="ticket__body">
          <dl class="summary" id="vSummary"></dl>
          <div id="cancelArea"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let creds = null;
    let booking = null;

    function render() {
      const b = booking;
      $('#lookup').classList.add('hidden');
      $('#view').classList.remove('hidden');
      $('#vCode').textContent = b.code;
      const badge = $('#vStatus');
      badge.className = `badge ${b.status}`;
      badge.textContent = statusLabel(b.status);
      $('#vTime').innerHTML = `<span class="ball"></span>${esc(b.start)}–${esc(b.end)}`;
      $('#vSummary').innerHTML = `
        <dt>Day</dt><dd>${esc(prettyDate(b.date))}</dd>
        <dt>Table</dt><dd>${esc(b.table.name)}</dd>
        <dt>Session</dt><dd>${esc(b.typeLabel)}</dd>
        <dt>Name</dt><dd>${esc(b.name)}</dd>
        <dt>Players</dt><dd>${b.players}</dd>
        <dt>Price, at the desk</dt><dd class="price">${esc(money(b.price, b.currency))}</dd>`;

      const area = $('#cancelArea');
      if (b.canCancel) {
        area.innerHTML = `<button class="btn btn--danger btn--lg btn--block" id="cancelBtn" type="button">Cancel booking</button>
          <p class="muted xsmall mt-2">Online cancellation closes ${b.cancelCutoffMinutes} minutes before the start.</p>`;
        $('#cancelBtn').onclick = cancel;
      } else if (b.status === 'confirmed') {
        area.innerHTML = `<p class="empty">It's too close to the start time to cancel online. Please call the center.</p>`;
      } else {
        area.innerHTML = '';
      }
    }

    function message(text, kind) {
      const el = $('#viewMsg');
      el.className = `alert ${kind}`;
      el.textContent = text;
      el.classList.toggle('hidden', !text);
    }

    async function cancel() {
      if (!confirm('Cancel this booking? The table will be released to other players.')) return;
      const btn = $('#cancelBtn');
      setLoading(btn, true);
      try {
        booking = await api(`/api/bookings/${encodeURIComponent(booking.code)}/cancel`, { method: 'POST', body: creds });
        render();
        message('Your booking was cancelled.', 'ok');
      } catch (err) {
        setLoading(btn, false);
        message(err.message, 'err');
      }
    }

    async function load(code, c) {
      const q = c.token ? `token=${encodeURIComponent(c.token)}` : `phone=${encodeURIComponent(c.phone)}`;
      booking = await api(`/api/bookings/${encodeURIComponent(code)}?${q}`);
      creds = c;
      render();
    }

    $('#lookupForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = $('#lookupError');
      err.classList.add('hidden');
      setLoading($('#lookupBtn'), true);
      try {
        await load($('#code').value.trim().toUpperCase(), { phone: $('#phone').value });
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
      } finally {
        setLoading($('#lookupBtn'), false);
      }
    });

    (async () => {
      api('/api/config').then(c => { $('#centerName').textContent = c.centerName; }).catch(() => {});
      const code = params.get('code');
      const token = params.get('t');
      if (code && token) {
        try { await load(code, { token }); return; } catch { /* fall through to manual lookup */ }
      }
      if (code) $('#code').value = code;
      $('#lookup').classList.remove('hidden');
    })();
  </script>
</body>
</html>
