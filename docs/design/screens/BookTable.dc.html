<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book a table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:#0B1F3A}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #0B1F3A; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="flex-grow: 1; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E8F0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column">
        <h1 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Book a table</h1>
        <span style="font-size: 13px; color: #5B6B82">[Club name] · Main hall</span>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{d.pick}}" style="flex: 1 1 0; min-width: 0; height: 64px; border-radius: 14px; border: 1.5px solid #0B1F3A; background: #0B1F3A; color: #FFFFFF; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; box-shadow: 0 6px 14px rgba(11,31,58,0.25)"><span style="font-size: 11px; font-weight: 600; color: #C7D2E3">{{d.dow}}</span><span style="font-size: 18px; font-weight: 800">{{d.num}}</span></button>
        </sc-if>
        <sc-if value="{{d.off}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{d.pick}}" style="flex: 1 1 0; min-width: 0; height: 64px; border-radius: 14px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer"><span style="font-size: 11px; font-weight: 600; color: #5B6B82">{{d.dow}}</span><span style="font-size: 18px; font-weight: 800">{{d.num}}</span></button>
        </sc-if>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700">Duration</span>
      <div role="group" aria-label="Duration" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E6EBF2; border-radius: 14px">
        <sc-for list="{{durs}}" as="u" hint-placeholder-count="3">
          <sc-if value="{{u.on}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{u.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(11,31,58,0.12)">{{u.label}}</button>
          </sc-if>
          <sc-if value="{{u.off}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{u.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #3B4A60; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{u.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; font-weight: 700">Start time</span>
        <span style="display: flex; gap: 12px; font-size: 11px; color: #5B6B82; font-weight: 600">
          <span style="display: flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F97316"></span>Peak</span>
          <span style="display: flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #D5DCE7"></span>Full</span>
        </span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="12">
          <sc-if value="{{s.sel}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="true" onClick="{{s.pick}}" style="height: 44px; border-radius: 12px; border: 1.5px solid #0B1F3A; background: #0B1F3A; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; position: relative">{{s.time}}</button>
          </sc-if>
          <sc-if value="{{s.open}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{s.pick}}" style="height: 44px; border-radius: 12px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; position: relative">{{s.time}}<sc-if value="{{s.peak}}" hint-placeholder-val="{{ false }}"><span aria-label="peak" style="position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #F97316"></span></sc-if></button>
          </sc-if>
          <sc-if value="{{s.full}}" hint-placeholder-val="{{ false }}">
            <button type="button" disabled style="height: 44px; border-radius: 12px; border: 1.5px dashed #C9D2DF; background: #EDF1F6; color: #6B7A90; font: inherit; font-size: 14px; font-weight: 500; text-decoration: line-through">{{s.time}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700">Table</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" aria-pressed="true" style="text-align: left; font: inherit; border-radius: 14px; border: 2px solid #0B1F3A; background: #FFFFFF; color: #0B1F3A; padding: 12px; display: flex; flex-direction: column; gap: 2px; cursor: pointer">
          <span style="font-size: 14px; font-weight: 700">Main hall</span><span style="font-size: 12px; color: #5B6B82">Auto-assign best table</span>
        </button>
        <button type="button" style="text-align: left; font: inherit; border-radius: 14px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; padding: 12px; display: flex; flex-direction: column; gap: 2px; cursor: pointer">
          <span style="font-size: 14px; font-weight: 700">Private room</span><span style="font-size: 12px; color: #5B6B82">More space · 1 table</span>
        </button>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 14px 20px 26px; display: flex; align-items: center; gap: 14px; box-shadow: 0 -8px 24px rgba(11,31,58,0.06)">
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <span style="font-size: 13px; color: #5B6B82; font-weight: 600">{{summary}}</span>
      <span style="font-size: 18px; font-weight: 800">[PRICE] <span style="font-size: 12px; font-weight: 600; color: #C2410C">member rate</span></span>
    </div>
    <a href="Checkout.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 22px; border-radius: 16px; background: #0B1F3A; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 20px rgba(11,31,58,0.25)">Continue
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 1, dur: 60, slot: '18:00' }; }
  renderVals() {
    var self = this;
    var dows = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    var nums = [26, 27, 28, 29, 30, 31, 1];
    var days = dows.map(function (d, i) {
      var on = self.state.day === i;
      return { dow: d, num: nums[i], on: on, off: !on, pick: function () { self.setState({ day: i }); } };
    });
    var durs = [30, 60, 90].map(function (m) {
      var on = self.state.dur === m;
      return { label: m + ' min', on: on, off: !on, pick: function () { self.setState({ dur: m }); } };
    });
    var times = ['16:00', '16:30', '17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:00', '21:30'];
    var full = { '17:00': 1, '18:30': 1, '19:00': 1 };
    var slots = times.map(function (t) {
      var isFull = !!full[t];
      var sel = !isFull && self.state.slot === t;
      var h = parseInt(t, 10);
      return { time: t, full: isFull, sel: sel, open: !isFull && !sel, peak: h >= 18 && h < 21,
        pick: function () { self.setState({ slot: t }); } };
    });
    var start = self.state.slot.split(':');
    var mins = parseInt(start[0], 10) * 60 + parseInt(start[1], 10) + self.state.dur;
    var end = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
    var summary = dows[self.state.day] + ' ' + nums[self.state.day] + ' · ' + self.state.slot + '–' + end;
    return { days: days, durs: durs, slots: slots, summary: summary };
  }
}
</script>
</body>
</html>
