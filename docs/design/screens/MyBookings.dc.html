<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My bookings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:#0B1F3A}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #0B1F3A; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="flex-grow: 1; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">My bookings</h1>

    <div role="tablist" aria-label="Bookings" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E6EBF2; border-radius: 14px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
          <button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(11,31,58,0.12)">{{t.label}}</button>
        </sc-if>
        <sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}">
          <button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #3B4A60; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button>
        </sc-if>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #0B1F3A; color: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #C7D2E3; font-weight: 600">Table credits</span>
        <span style="font-size: 24px; font-weight: 800">3 <span style="font-size: 13px; font-weight: 600; color: #C7D2E3">left</span></span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5B6B82; font-weight: 600">Lesson pack</span>
        <span style="font-size: 24px; font-weight: 800">4 <span style="font-size: 13px; font-weight: 600; color: #5B6B82">of 10</span></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{items}}" as="b" hint-placeholder-count="3">
        <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; gap: 12px; align-items: center">
            <div style="width: 48px; height: 52px; border-radius: 12px; background: #EEF2F8; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0">
              <span style="font-size: 10px; font-weight: 700; color: #5B6B82">{{b.dow}}</span><span style="font-size: 18px; font-weight: 800; line-height: 1">{{b.num}}</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
              <span style="font-size: 15px; font-weight: 700">{{b.title}}</span>
              <span style="font-size: 13px; color: #5B6B82">{{b.meta}}</span>
            </div>
            <sc-if value="{{b.lesson}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: #FFEDD5; color: #9A3412">{{b.kind}}</span>
            </sc-if>
            <sc-if value="{{b.table}}" hint-placeholder-val="{{ true }}">
              <span style="font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: #E0E7F5; color: #0B1F3A">{{b.kind}}</span>
            </sc-if>
          </div>
          <sc-if value="{{b.upcoming}}" hint-placeholder-val="{{ true }}">
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <button type="button" style="height: 40px; border-radius: 12px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Reschedule</button>
              <button type="button" style="height: 40px; border-radius: 12px; border: 1.5px solid #FECACA; background: #FFFFFF; color: #B91C1C; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Cancel</button>
            </div>
          </sc-if>
          <sc-if value="{{b.past}}" hint-placeholder-val="{{ false }}">
            <a href="BookTable.dc.html" style="display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 12px; background: #0B1F3A; color: #FFFFFF; font-size: 13px; font-weight: 700; text-decoration: none">Book again</a>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Main" style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 8px 8px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="BookTable.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="9" rx="1.5"></rect><path d="M12 7v9M5 16v4M19 16v4"></path></svg>Tables</a>
    <a href="Coaches.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"></path></svg>Lessons</a>
    <a href="MyBookings.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #0B1F3A; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>Bookings</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'up' }; }
  renderVals() {
    var self = this;
    var tabs = [{ id: 'up', label: 'Upcoming' }, { id: 'past', label: 'Past' }].map(function (t) {
      var on = self.state.tab === t.id;
      return { label: t.label, on: on, off: !on, pick: function () { self.setState({ tab: t.id }); } };
    });
    var up = self.state.tab === 'up';
    var upcoming = [
      { dow: 'TUE', num: 27, title: 'Table · 18:00–19:00', meta: 'Main hall · 2 players', kind: 'Table', lesson: false },
      { dow: 'THU', num: 29, title: 'Private lesson · 60 min', meta: 'with [Coach name] · 19:00', kind: 'Lesson', lesson: true },
      { dow: 'SAT', num: 31, title: 'Open play', meta: '10:00–12:00 · Intermediate', kind: 'Group', lesson: true }
    ];
    var past = [
      { dow: 'FRI', num: 23, title: 'Table · 20:00–21:30', meta: 'Private room · 4 players', kind: 'Table', lesson: false },
      { dow: 'WED', num: 21, title: 'Private lesson · 60 min', meta: 'with [Coach name] · 18:00', kind: 'Lesson', lesson: true }
    ];
    var items = (up ? upcoming : past).map(function (b) {
      return Object.assign({}, b, { table: !b.lesson, upcoming: up, past: !up });
    });
    return { tabs: tabs, items: items };
  }
}
</script>
</body>
</html>
