<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lessons and coaches</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:#0B1F3A}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #0B1F3A; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="flex-grow: 1; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Lessons</h1>

    <div role="tablist" aria-label="Lesson type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E6EBF2; border-radius: 14px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
          <button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(11,31,58,0.12)">{{t.label}}</button>
        </sc-if>
        <sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}">
          <button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #3B4A60; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button>
        </sc-if>
      </sc-for>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button type="button" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #0B1F3A; background: #0B1F3A; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">All levels</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Beginner</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Intermediate</button>
      <button type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Kids</button>
    </div>

    <sc-if value="{{privateTab}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{coaches}}" as="c" hint-placeholder-count="3">
          <a href="CoachDetail.dc.html" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 14px; display: flex; gap: 14px; align-items: center; text-decoration: none; color: #0B1F3A">
            <span style="width: 56px; height: 56px; border-radius: 16px; background: #0B1F3A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex-shrink: 0">{{c.ini}}</span>
            <span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
              <span style="font-size: 16px; font-weight: 700">{{c.name}}</span>
              <span style="font-size: 13px; color: #5B6B82">{{c.spec}}</span>
              <span style="font-size: 12px; font-weight: 700; color: #C2410C">{{c.next}}</span>
            </span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 18l6-6-6-6"></path></svg>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{groupTab}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{classes}}" as="g" hint-placeholder-count="3">
          <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; justify-content: space-between; gap: 12px">
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 700">{{g.title}}</span>
                <span style="font-size: 13px; color: #5B6B82">{{g.when}}</span>
              </div>
              <span style="font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: #E0E7F5; height: fit-content; white-space: nowrap">{{g.level}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px">
              <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
                <div style="height: 6px; border-radius: 6px; background: #E6EBF2; overflow: hidden"><div style="height: 100%; width: {{g.pct}}; background: #0B1F3A; border-radius: 6px"></div></div>
                <span style="font-size: 12px; color: #5B6B82; font-weight: 600">{{g.spots}}</span>
              </div>
              <sc-if value="{{g.open}}" hint-placeholder-val="{{ true }}">
                <button type="button" style="height: 40px; padding: 0 18px; border-radius: 12px; border: 0; background: #0B1F3A; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Join</button>
              </sc-if>
              <sc-if value="{{g.full}}" hint-placeholder-val="{{ false }}">
                <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #0B1F3A; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Join waitlist</button>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Main" style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 8px 8px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="BookTable.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="9" rx="1.5"></rect><path d="M12 7v9M5 16v4M19 16v4"></path></svg>Tables</a>
    <a href="Coaches.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #0B1F3A; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"></path></svg>Lessons</a>
    <a href="MyBookings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>Bookings</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'private' }; }
  renderVals() {
    var self = this;
    var tabs = [{ id: 'private', label: 'Private lessons' }, { id: 'group', label: 'Group classes' }].map(function (t) {
      var on = self.state.tab === t.id;
      return { label: t.label, on: on, off: !on, pick: function () { self.setState({ tab: t.id }); } };
    });
    var coaches = [
      { ini: 'C1', name: '[Head coach]', spec: 'Footwork · serve & return · all levels', next: 'Next free: Today 19:00' },
      { ini: 'C2', name: '[Coach name]', spec: 'Beginners & kids · fundamentals', next: 'Next free: Tomorrow 16:30' },
      { ini: 'C3', name: '[Coach name]', spec: 'Competitive play · match tactics', next: 'Next free: Thu 18:00' }
    ];
    var classes = [
      { title: 'Beginner fundamentals', when: 'Wed 29 Oct · 18:00 · 60 min', level: 'Beginner', taken: 5, cap: 8 },
      { title: 'Intermediate drills', when: 'Thu 30 Oct · 19:30 · 90 min', level: 'Intermediate', taken: 8, cap: 8 },
      { title: 'Kids club (8–12)', when: 'Sat 1 Nov · 10:00 · 60 min', level: 'Kids', taken: 3, cap: 10 }
    ].map(function (g) {
      var full = g.taken >= g.cap;
      return Object.assign({}, g, { pct: Math.round(g.taken / g.cap * 100) + '%', spots: full ? 'Full · waitlist open' : (g.cap - g.taken) + ' spots left', full: full, open: !full });
    });
    return { tabs: tabs, coaches: coaches, classes: classes, privateTab: self.state.tab === 'private', groupTab: self.state.tab === 'group' };
  }
}
</script>
</body>
</html>
