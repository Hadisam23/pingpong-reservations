<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile and membership</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:#0B1F3A}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #0B1F3A; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="flex-grow: 1; padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 60px; height: 60px; border-radius: 50%; background: #0B1F3A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">YN</span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 20px; font-weight: 800">[Your name]</span>
        <span style="font-size: 13px; color: #5B6B82">Intermediate · member since [date]</span>
      </div>
      <button type="button" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Edit</button>
    </div>

    <div style="background: #0B1F3A; color: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; box-shadow: 0 14px 30px rgba(11,31,58,0.25)">
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 58%; height: 1px; background: rgba(255,255,255,0.12)"></div>
      <div aria-hidden="true" style="position: absolute; right: 22px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: #F97316; box-shadow: 0 6px 18px rgba(249,115,22,0.5)"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; position: relative">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #FDBA74">Membership</span>
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Club</span>
        <span style="font-size: 13px; color: #C7D2E3">Renews [date] · [PRICE]/mo</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; position: relative; padding-top: 6px">
        <div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 800">12</span><span style="font-size: 11px; color: #C7D2E3; font-weight: 600">Sessions this month</span></div>
        <div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 800">3</span><span style="font-size: 11px; color: #C7D2E3; font-weight: 600">Table credits</span></div>
        <div style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 800">14d</span><span style="font-size: 11px; color: #C7D2E3; font-weight: 600">Booking window</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; position: relative">
        <a href="Membership.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: #FFFFFF; color: #0B1F3A; font-size: 14px; font-weight: 700; text-decoration: none">Upgrade to Pro</a>
        <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.35); background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Manage</button>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <button type="button" style="width: 100%; font: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 54px; border: 0; border-bottom: 1px solid #EEF2F7; background: #FFFFFF; color: #0B1F3A; cursor: pointer">
          <span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{r.label}}</span>
          <span style="font-size: 13px; color: #5B6B82">{{r.hint}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
      </sc-for>
    </div>
    <a href="Main.dc.html" style="align-self: center; font-size: 14px; font-weight: 700; color: #B91C1C; text-decoration: none; padding: 8px">Log out</a>
  </div>

  <nav aria-label="Main" style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 8px 8px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="BookTable.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="9" rx="1.5"></rect><path d="M12 7v9M5 16v4M19 16v4"></path></svg>Tables</a>
    <a href="Coaches.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"></path></svg>Lessons</a>
    <a href="MyBookings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>Bookings</a>
    <a href="Profile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #0B1F3A; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [
      { label: 'Lesson packages', hint: '4 of 10 left' },
      { label: 'Payment methods', hint: 'Card ··4242' },
      { label: 'Family & guests', hint: '' },
      { label: 'Notifications', hint: 'On' },
      { label: 'Club rules & policies', hint: '' },
      { label: 'Help & contact', hint: '' }
    ] };
  }
}
</script>
</body>
</html>
