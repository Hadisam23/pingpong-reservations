<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:#0B1F3A}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #0B1F3A; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="flex-grow: 1; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; color: #5B6B82; font-weight: 500">Good evening</span>
        <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em">[First name]</span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center">
        <span style="font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2E8F0">Club member</span>
        <button type="button" aria-label="Notifications" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E2E8F0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span aria-hidden="true" style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #F97316; border: 2px solid #FFFFFF"></span>
        </button>
      </div>
    </div>

    <div style="background: #0B1F3A; color: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; box-shadow: 0 14px 30px rgba(11,31,58,0.25)">
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,0.10)"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; position: relative">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #FDBA74">Next up · Tomorrow</span>
        <span style="font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)">Confirmed</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: flex-end; position: relative">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.02em">18:00 – 19:00</span>
          <span style="font-size: 14px; color: #C7D2E3">Table 3 · Main hall · 2 players</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; position: relative">
        <a href="Confirmed.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 12px; background: #FFFFFF; color: #0B1F3A; font-size: 14px; font-weight: 700; text-decoration: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"></path></svg>Check-in pass</a>
        <a href="MyBookings.dc.html" style="display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.35); color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Manage</a>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="BookTable.dc.html" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: #0B1F3A">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #0B1F3A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="9" rx="1.5"></rect><path d="M12 7v9M5 16v4M19 16v4"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Book a table</span><span style="font-size: 12px; color: #5B6B82">From 30 min</span></span>
      </a>
      <a href="Coaches.dc.html" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: #0B1F3A">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #F97316; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Book a lesson</span><span style="font-size: 12px; color: #5B6B82">Private or group</span></span>
      </a>
      <a href="Coaches.dc.html" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0B1F3A">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #EEF2F8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 20v-1a5 5 0 0 1 10 0v1M15 20v-1a4 4 0 0 1 6-3.4"></path></svg></span>
        <span style="font-size: 14px; font-weight: 700">Open play</span>
      </a>
      <a href="Profile.dc.html" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0B1F3A">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #EEF2F8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg></span>
        <span style="font-size: 14px; font-weight: 700">Membership</span>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 17px; font-weight: 800">Free tables today</h2>
        <a href="BookTable.dc.html" style="font-size: 13px; font-weight: 700; text-decoration: none">See all</a>
      </div>
      <div style="display: flex; gap: 10px">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
          <a href="BookTable.dc.html" style="flex: 1 1 0; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #0B1F3A">
            <span style="font-size: 15px; font-weight: 800">{{s.time}}</span>
            <span style="font-size: 11px; font-weight: 600; color: #5B6B82">{{s.free}}</span>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 8px 8px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a href="Home.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #0B1F3A; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="BookTable.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="9" rx="1.5"></rect><path d="M12 7v9M5 16v4M19 16v4"></path></svg>Tables</a>
    <a href="Coaches.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"></path></svg>Lessons</a>
    <a href="MyBookings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>Bookings</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; text-decoration: none; color: #5B6B82; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { slots: [
      { time: '17:30', free: '4 free' },
      { time: '18:00', free: '2 free' },
      { time: '19:30', free: '5 free' },
      { time: '21:00', free: '6 free' }
    ] };
  }
}
</script>
</body>
</html>
