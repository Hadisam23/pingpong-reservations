<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach and book a lesson</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:#0B1F3A}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F6FA; color: #0B1F3A; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="background: #0B1F3A; color: #FFFFFF; padding: 24px 20px 22px; display: flex; flex-direction: column; gap: 16px; border-radius: 0 0 28px 28px; position: relative; overflow: hidden; flex-shrink: 0">
    <div aria-hidden="true" style="position: absolute; right: -50px; top: -40px; width: 180px; height: 180px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.08)"></div>
    <a href="Coaches.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; position: relative">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; gap: 14px; align-items: center; position: relative">
      <span style="width: 64px; height: 64px; border-radius: 18px; background: #FFFFFF; color: #0B1F3A; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800">C1</span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">[Head coach]</span>
        <span style="font-size: 13px; color: #C7D2E3">[Certification] · [X] years coaching</span>
      </div>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap; position: relative">
      <span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)">Footwork</span>
      <span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)">Serve &amp; return</span>
      <span style="font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.12)">All levels</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700">Lesson type</span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
          <sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="true" onClick="{{t.pick}}" style="font: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 2px solid #0B1F3A; background: #FFFFFF; color: #0B1F3A; cursor: pointer">
              <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 6px solid #0B1F3A; box-sizing: border-box; flex-shrink: 0"></span>
              <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{t.name}}</span><span style="font-size: 12px; color: #5B6B82">{{t.desc}}</span></span>
              <span style="font-size: 14px; font-weight: 700">[PRICE]</span>
            </button>
          </sc-if>
          <sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{t.pick}}" style="font: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; cursor: pointer">
              <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; border: 2px solid #9AA8BC; box-sizing: border-box; flex-shrink: 0"></span>
              <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">{{t.name}}</span><span style="font-size: 12px; color: #5B6B82">{{t.desc}}</span></span>
              <span style="font-size: 14px; font-weight: 700">[PRICE]</span>
            </button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #F97316; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
      </span>
      <span style="flex-grow: 1; font-size: 13px; line-height: 1.4; color: #7C2D12"><b>Save with a 5 or 10-lesson pack.</b> Credits are used automatically.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700">Thu 29 Oct · available</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
          <sc-if value="{{s.on}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-pressed="true" onClick="{{s.pick}}" style="height: 44px; border-radius: 12px; border: 1.5px solid #0B1F3A; background: #0B1F3A; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{s.time}}</button>
          </sc-if>
          <sc-if value="{{s.off}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{s.pick}}" style="height: 44px; border-radius: 12px; border: 1.5px solid #E2E8F0; background: #FFFFFF; color: #0B1F3A; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{s.time}}</button>
          </sc-if>
        </sc-for>
      </div>
      <button type="button" style="align-self: flex-start; background: none; border: 0; padding: 4px 0; font: inherit; font-size: 13px; font-weight: 700; color: #0B1F3A; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">See other days</button>
    </div>
  </div>

  <div style="flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E8F0; padding: 14px 20px 26px">
    <a href="Checkout.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 16px; background: #0B1F3A; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; box-shadow: 0 8px 20px rgba(11,31,58,0.25)">Book {{chosen}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { type: 'private', slot: '19:00' }; }
  renderVals() {
    var self = this;
    var types = [
      { id: 'private', name: 'Private · 60 min', desc: '1-on-1 with the coach, table included' },
      { id: 'semi', name: 'Semi-private · 60 min', desc: 'Bring a partner, split the price' },
      { id: 'video', name: 'Video analysis · 45 min', desc: 'Recorded session + written feedback' }
    ].map(function (t) {
      var on = self.state.type === t.id;
      return Object.assign({}, t, { on: on, off: !on, pick: function () { self.setState({ type: t.id }); } });
    });
    var slots = ['16:00', '17:30', '19:00', '20:30'].map(function (t) {
      var on = self.state.slot === t;
      return { time: t, on: on, off: !on, pick: function () { self.setState({ slot: t }); } };
    });
    return { types: types, slots: slots, chosen: 'Thu · ' + self.state.slot };
  }
}
</script>
</body>
</html>
