<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Booking confirmed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:#0B1F3A}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1F3A; color: #FFFFFF; display: flex; flex-direction: column; padding: 40px 20px 28px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden; position: relative">
  <div aria-hidden="true" style="position: absolute; left: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.08)"></div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative">
    <div style="width: 64px; height: 64px; border-radius: 50%; background: #F97316; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(249,115,22,0.45)">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
    </div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">You're booked!</h1>
    <p style="margin: 0; font-size: 15px; color: #C7D2E3; text-align: center">We sent the details to your email and will remind you 2 hours before.</p>
  </div>

  <div style="margin-top: 24px; background: #FFFFFF; color: #0B1F3A; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82; font-weight: 600">Date</span><span style="font-size: 16px; font-weight: 800">Tue 27 Oct</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82; font-weight: 600">Time</span><span style="font-size: 16px; font-weight: 800">18:00 – 19:00</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82; font-weight: 600">Where</span><span style="font-size: 16px; font-weight: 800">Main hall</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B82; font-weight: 600">Booking</span><span style="font-size: 16px; font-weight: 800">#RC-[ID]</span></div>
    </div>
    <div aria-hidden="true" style="border-top: 2px dashed #E2E8F0; margin: 0 -20px"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div role="img" aria-label="Check-in QR code" style="width: 168px; height: 168px; padding: 10px; border-radius: 14px; border: 1px solid #E2E8F0; box-sizing: border-box; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr)); grid-template-rows: repeat(21, minmax(0, 1fr))">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="441">
          <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><span style="background: #0B1F3A"></span></sc-if>
          <sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #5B6B82; font-weight: 600">Scan at the door to check in</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; position: relative">
    <button type="button" style="height: 50px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,0.35); background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>Add to calendar</button>
    <button type="button" style="height: 50px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,0.35); background: transparent; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"></path></svg>Invite friends</button>
  </div>
  <a href="Home.dc.html" style="margin-top: 10px; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #FFFFFF; color: #0B1F3A; font-size: 16px; font-weight: 700; text-decoration: none; position: relative">Done</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var n = 21, cells = [];
    function finder(r, c, r0, c0) {
      var y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      if (y === 0 || y === 6 || x === 0 || x === 6) return true;
      if (y >= 2 && y <= 4 && x >= 2 && x <= 4) return true;
      return false;
    }
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var f = finder(r, c, 0, 0);
        if (f === null) f = finder(r, c, 0, 14);
        if (f === null) f = finder(r, c, 14, 0);
        var on;
        if (f !== null) on = f;
        else if ((r === 7 && c < 8) || (c === 7 && r < 8) || (r === 7 && c > 12) || (c === 13 && r < 8) || (r === 13 && c < 8) || (c === 7 && r > 12)) on = false;
        else on = ((r * 7 + c * 13 + r * c) % 5) < 2;
        cells.push({ on: on, off: !on });
      }
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
